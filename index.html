<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)">
<title>Enautec Uren</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="logo-mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --font-body: 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-head: 'Space Grotesk', 'Atkinson Hyperlegible', system-ui, sans-serif;
  /* Huisstijl Enautec: zwart, rood, wit */
  --bg: #f4f4f3; --surface: #ffffff; --surface2: #ececea; --fg: #141414; --muted: #5d5d5b; --line: #dad9d6;
  --ink: #141414; --ink-on: #ffffff;
  --red: #e23b3b; --red-text: #c62828; --red-soft: #fde6e4;
  --ok: #1f7a45; --ok-soft: #e1f2e7; --warn: #8a5a00; --warn-soft: #fff1d0;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 8px 22px rgba(0,0,0,.06);
  --radius: 12px;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101010; --surface: #1b1b1b; --surface2: #262626; --fg: #f1f1f0; --muted: #a5a5a2; --line: #333331;
    --ink: #f1f1f0; --ink-on: #141414;
    --red: #f05a55; --red-text: #ff8a80; --red-soft: #3a1b1a;
    --ok: #6fcf97; --ok-soft: #16301f; --warn: #f2c56b; --warn-soft: #382c12;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"] {
  --bg: #101010; --surface: #1b1b1b; --surface2: #262626; --fg: #f1f1f0; --muted: #a5a5a2; --line: #333331;
  --ink: #f1f1f0; --ink-on: #141414; --red: #f05a55; --red-text: #ff8a80; --red-soft: #3a1b1a;
  --ok: #6fcf97; --ok-soft: #16301f; --warn: #f2c56b; --warn-soft: #382c12;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 16px/1.5 var(--font-body); padding-bottom: calc(72px + env(safe-area-inset-bottom)); }
h1, h2, h3 { font-family: var(--font-head); line-height: 1.2; margin: 0 0 10px; }
h1 { font-size: 24px; } h2 { font-size: 18px; } h3 { font-size: 16px; }
a { color: var(--red-text); }
code { font-size: 13px; word-break: break-all; background: var(--surface2); padding: 1px 5px; border-radius: 5px; }

/* Kopbalk */
.topbar { position: sticky; top: 0; z-index: 10; background: var(--surface); border-bottom: 3px solid var(--red);
  display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px; padding-top: calc(10px + env(safe-area-inset-top)); }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--fg); }
.brand img { width: 34px; height: 32px; }
.brand b { font-family: var(--font-head); letter-spacing: .18em; font-size: 17px; }
.brand small { display: block; color: var(--red-text); font-size: 11px; letter-spacing: .02em; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .brand img { filter: invert(1) hue-rotate(180deg); } }
.sync { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; border: 1px solid var(--line); border-radius: 99px; padding: 4px 10px; background: var(--surface); color: var(--fg); cursor: pointer; }
.sync::before { content: ''; width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
.sync.ok::before { background: var(--ok); } .sync.warn::before { background: #d9a400; } .sync.err::before { background: var(--red); }
.sync.busy::before { background: var(--muted); animation: pulse 1s infinite alternate; }
@keyframes pulse { to { opacity: .3; } }
@media (max-width: 420px) { .sync span { display: none; } }
.top-actions { display: flex; align-items: center; gap: 8px; }
.mode-switch { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 14px; text-decoration: none;
  padding: 6px 12px; border-radius: 99px; border: 1.5px solid var(--line); color: var(--fg); background: var(--surface); white-space: nowrap; }
.mode-switch[hidden] { display: none; }
.mode-switch:hover { border-color: var(--fg); }
/* Update beschikbaar: gele balk met knop */
body.update-ready .topbar { background: #ffd54a; border-bottom-color: #c9a100; }
body.update-ready .brand, body.update-ready .brand b { color: #141414; }
body.update-ready .brand small { color: #7a2020; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) body.update-ready .brand img { filter: none; } }
.update-btn { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 6px 12px; border-radius: 99px;
  background: #141414; color: #ffd54a; border: none; font-weight: 700; font-size: 14px; }
.update-btn[hidden] { display: none; }
.update-btn svg { animation: spinhint 2.4s ease-in-out infinite; }
@keyframes spinhint { 0%, 70% { transform: rotate(0); } 100% { transform: rotate(-360deg); } }
@media (prefers-reduced-motion: reduce) { .update-btn svg { animation: none; } }
@media (max-width: 420px) { .update-btn span { display: none; } }
.link-form { display: grid; gap: 8px; margin: 12px 0; text-align: left; }
.link-form input, .link-form select { width: 100%; }
.key-admin { margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--line, #ddd); }
.key-admin h2 { font-size: 1rem; margin: 0 0 8px; }
.link-form [hidden], .small [hidden], button[hidden] { display: none; }
.link-form .row { justify-content: flex-end; }
.live-note { margin: 0 0 6px; }
.live-note::first-letter { color: var(--ok); }
/* Bevestigingsvenster */
.modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
.modal { background: var(--surface); color: var(--fg); border-radius: 14px; padding: 20px; max-width: 420px; width: 100%; box-shadow: var(--shadow); }
.modal-actions { justify-content: flex-end; margin-top: 14px; }
/* In het beheer: duidelijk zichtbaar dat je niet in je eigen uren zit */
body.admin-mode .topbar { border-bottom-color: var(--ink); }
body.admin-mode .mode-switch { background: var(--red); border-color: var(--red); color: #fff; }
body.admin-mode { padding-bottom: 24px; }

main { max-width: 880px; margin: 0 auto; padding: 16px; }
.page-title { margin: 6px 2px 14px; }
.section-title { margin: 22px 2px 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); }
.card.narrow { max-width: 440px; margin-left: auto; margin-right: auto; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spread { justify-content: space-between; }
.muted { color: var(--muted); } .small { font-size: 13px; } .center { text-align: center; }
.ok-text { color: var(--ok); } .warn-text { color: var(--warn); font-size: 14px; }

/* Knoppen en velden */
button, .btn { font: inherit; font-weight: 700; border-radius: 10px; padding: 9px 14px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid transparent; min-height: 42px; }
.primary { background: var(--ink); color: var(--ink-on); }
.primary:hover { background: var(--red); color: #fff; }
.secondary { background: var(--surface); color: var(--fg); border-color: var(--line); }
.secondary:hover { border-color: var(--fg); }
.link { background: none; border: none; color: var(--red-text); padding: 6px 4px; min-height: 0; font-weight: 700; }
.link.danger, .danger { color: var(--red-text); }
.big { width: 100%; justify-content: center; padding: 14px; font-size: 17px; margin-top: 10px; }
button:disabled { opacity: .5; cursor: default; }
:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
input, select, textarea { font: inherit; color: var(--fg); background: var(--surface); border: 1.5px solid var(--line); border-radius: 9px; padding: 8px 10px; min-height: 42px; max-width: 100%; }
input:focus, select:focus, textarea:focus { border-color: var(--fg); outline: none; }
textarea { width: 100%; min-height: 70px; }
input:disabled, select:disabled { background: var(--surface2); color: var(--fg); opacity: 1; }

.pill { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: 13px; font-weight: 700; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.red { background: var(--red-soft); color: var(--red-text); }
.notice { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 10px 14px 10px 30px; margin: 12px 0 0; }
.error { background: var(--red-soft); color: var(--red-text); border-radius: 10px; padding: 10px 14px; margin: 10px 0; }
.callout { border-left: 4px solid var(--red); background: var(--surface2); border-radius: 0 10px 10px 0; padding: 12px 14px; margin-top: 12px; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 8px; margin-top: 12px; }
.stat { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
.stat span { color: var(--muted); font-size: 13px; }
.stat b { display: block; font-family: var(--font-head); font-size: 22px; }

.datebar { display: grid; grid-template-columns: 48px 1fr 48px; align-items: center; text-align: center; gap: 8px; }
.datebar b { font-family: var(--font-head); font-size: 18px; text-transform: capitalize; }
.datebar input { display: block; margin: 6px auto 0; }
.icon { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; border: 1.5px solid var(--line); font-size: 24px; text-decoration: none; color: var(--fg); background: var(--surface); }

/* Tijdlijn */
.seg { border: 1px solid var(--line); border-left: 5px solid var(--line); border-radius: 10px; padding: 12px; margin: 10px 0; }
.seg[data-kind="werk"] { border-left-color: var(--ink); }
.seg[data-kind="atelier"] { border-left-color: var(--red); }
.seg[data-kind="leverancier"] { border-left-color: #a06a3c; }
.seg[data-kind="verplaatsing"], .seg[data-kind="woon-werk"] { border-left-color: #9a9a96; border-left-style: dashed; }
.seg[data-kind="pauze"] { border-left-color: var(--ok); }
.seg[data-kind="onbekend"] { border-left-color: #d9a400; background: var(--warn-soft); }
.seg-grid { display: grid; grid-template-columns: 7.5em 7.5em 1fr; gap: 8px; align-items: center; }
.seg-grid .full, .seg-grid select.full, .seg-grid input.full { grid-column: 1 / -1; width: 100%; }
.seg-grid .full-right { grid-column: 1 / -1; justify-self: end; }
.seg-grid .km input { width: 6em; }
@media (max-width: 540px) {
  .seg-grid { grid-template-columns: 1fr 1fr; }
  .seg-grid select[data-f="kind"] { grid-column: 1 / -1; }
  .seg-grid input[type=time] { width: 100%; }
}

/* Kleuren voor uren (zoals Atree): werk bij klant rood, atelier donker, verplaatsing grijs gearceerd */
:root { --c-werf: #d7262e; --c-werf-hi: #ff5a5f; --c-atelier: #3d3d3d; --c-verpl: #8a8a8a; --c-pauze: #cfcfca; --c-exp: #e4e3de; --c-track: #ecebe6; --c-auto: #2a6fb0; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --c-atelier: #b9b9b5; --c-verpl: #6e6e6b; --c-pauze: #4a4a47; --c-exp: #34332f; --c-track: #262624; --c-auto: #7fb2ea; } }
:root[data-theme="dark"] { --c-atelier: #b9b9b5; --c-verpl: #6e6e6b; --c-pauze: #4a4a47; --c-exp: #34332f; --c-track: #262624; --c-auto: #7fb2ea; }
.c-werf { background: linear-gradient(180deg, var(--c-werf-hi), var(--c-werf)); }
.c-atelier { background: var(--c-atelier); }
.c-verpl { background: repeating-linear-gradient(45deg, var(--c-verpl) 0 5px, color-mix(in srgb, var(--c-verpl) 70%, #fff) 5px 8px); }
.c-pauze { background: var(--c-pauze); }
.c-onbekend { background: repeating-linear-gradient(45deg, #d9a400 0 5px, #f2d06b 5px 8px); }
.c-gat { background: repeating-linear-gradient(45deg, rgba(215,38,46,.22) 0 4px, transparent 4px 8px); outline: 1.5px dashed var(--c-werf); outline-offset: -1.5px; }
.c-exp { background: var(--c-exp); border: 1px solid var(--line); }
/* Dagbalk */
.track { position: relative; height: 38px; border-radius: 9px; background: var(--c-track); border: 1px solid var(--line); overflow: hidden; }
.track.compact { height: 26px; }
.track-lines i { position: absolute; top: 0; bottom: 0; width: 1px; background: color-mix(in srgb, var(--line) 70%, transparent); }
.tb { position: absolute; top: 3px; bottom: 3px; border-radius: 5px; overflow: hidden; display: flex; align-items: center; }
.tb span { color: #fff; font-size: 11px; font-weight: 700; padding: 0 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
.tb.c-gat { top: 0; bottom: 0; border-radius: 0; }
.tb.open { box-shadow: inset -6px 0 0 rgba(255,255,255,.6); }
.track.concept .tb:not(.c-gat) { opacity: .7; outline: 2px dashed var(--fg); outline-offset: -2px; }
.track.empty { background: transparent; border-style: dashed; display: flex; align-items: center; justify-content: center; font-size: 12px; }
.track.missing { border-color: var(--c-werf); background: repeating-linear-gradient(45deg, rgba(215,38,46,.10) 0 4px, transparent 4px 8px); color: var(--red-text); font-weight: 700; }
.track.axis { background: transparent; border: none; height: 0; }
.track.axis .track-lines { display: none; }
.track-hours { position: relative; height: 16px; font-size: 11px; color: var(--muted); margin-top: 2px; }
.track-hours span { position: absolute; transform: translateX(-50%); }
.track-hours span:first-child { transform: none; } .track-hours span:last-child { transform: translateX(-100%); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); margin-top: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend .sw { display: inline-block; width: 18px; height: 12px; border-radius: 3px; }
/* Tellers (zoals de kopbalk van Atree) */
.counters { display: grid; grid-template-columns: repeat(auto-fit, minmax(132px, 1fr)); gap: 8px; }
.counter b small { white-space: nowrap; }
.counters.dark { background: linear-gradient(180deg, #262626, #1c1c1c); border-radius: var(--radius); padding: 10px; border-bottom: 3px solid var(--c-werf); }
.counters.light { margin-top: 12px; }
.counter { border-radius: 10px; padding: 8px 10px; border: 1px solid var(--line); background: var(--surface); }
.counters.dark .counter { background: rgba(255,255,255,.07); border-color: rgba(255,255,255,.08); color: #fff; }
.counter > span { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; }
.counters.dark .counter > span { color: #a8a8a8; }
.counter b { display: block; font-family: var(--font-head); font-size: 20px; line-height: 1.25; }
.counter b small { font-size: 13px; font-weight: 500; opacity: .7; }
.counter .bar { height: 4px; border-radius: 2px; background: color-mix(in srgb, var(--muted) 25%, transparent); margin-top: 5px; overflow: hidden; }
.counter .bar i { display: block; height: 100%; background: var(--c-werf); border-radius: 2px; }
.counters.dark .counter .bar i { background: #cfcfcf; } .counters.dark .counter.red .bar i { background: var(--c-werf-hi); }
.counter.ok .bar i { background: var(--ok); } .counter.warn b { color: var(--warn); }
.danger { color: var(--red-text); }
.cap { text-transform: capitalize; }
/* Periode: kop met pijlen */
.period-head { display: grid; grid-template-columns: 48px 1fr 48px; align-items: center; text-align: center; gap: 8px; }
.period-head h2 { margin: 0; }
.subtabs { display: flex; background: var(--surface2); border-radius: 99px; padding: 4px; gap: 4px; margin: 0 0 12px; }
.subtabs a { flex: 1; text-align: center; padding: 8px; border-radius: 99px; text-decoration: none; color: var(--fg); font-weight: 700; }
.subtabs a.active { background: var(--ink); color: var(--ink-on); }
/* Week: rijen per dag met dagbalk */
.week .wrow { display: grid; grid-template-columns: 74px 1fr 62px; gap: 8px; align-items: center; padding: 5px 0; text-decoration: none; color: var(--fg); border-radius: 8px; }
.week a.wrow:hover { background: var(--surface2); }
.week .wrow.off .wday { color: var(--muted); }
.week .wrow.today .wday b { color: var(--red-text); }
.week .wday { font-size: 14px; line-height: 1.2; text-transform: capitalize; }
.week .wday small { display: block; font-size: 10px; color: var(--muted); text-transform: none; }
.week .wtot { text-align: right; font-family: var(--font-head); font-weight: 700; font-size: 15px; }
.week .wtot small { display: block; font-size: 10px; font-family: var(--font-body); color: var(--warn); }
.week .wtot.short { color: var(--red-text); }
.week .wrow.head, .week .wrow.foot { padding: 0; }
.week .wrow.foot { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 8px; }
.week .track-hours { margin: 0; }
@media (max-width: 420px) { .week .wrow { grid-template-columns: 54px 1fr 50px; gap: 5px; } .week .wday { font-size: 12px; } }
/* Grafieken */
.chart { width: 100%; height: auto; display: block; font-family: var(--font-body); max-width: 100%; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .ax { fill: var(--muted); font-size: 11px; } .chart .ax.small { font-size: 9px; } .chart .ax.off { fill: color-mix(in srgb, var(--muted) 60%, transparent); }
.chart .val { fill: var(--fg); font-size: 10px; font-weight: 700; }
.chart .col { fill: transparent; } .chart .col-off { fill: var(--surface2); opacity: .6; } .chart .col-today { fill: var(--red-soft); }
.chart a:hover .col, .chart a:hover .col-off { fill: var(--surface2); opacity: 1; }
.chart .f-werf { fill: var(--c-werf); } .chart .f-atelier { fill: var(--c-atelier); } .chart .f-verpl { fill: var(--c-verpl); }
.chart .f-verpl-h { fill: url(#hatchGrey); } .chart .hatch-line { stroke: color-mix(in srgb, var(--c-verpl) 55%, #fff); stroke-width: 3; }
.chart .f-exp { fill: var(--c-exp); stroke: var(--line); }
.chart .goal { stroke: var(--fg); stroke-width: 1.5; stroke-dasharray: 4 3; }
.chart .miss { fill: var(--c-werf); }
.chart .concept-outline { fill: none; stroke: var(--fg); stroke-width: 1.5; stroke-dasharray: 3 2; }
table.num td, table.num th { white-space: nowrap; }
tr.total td { font-weight: 700; background: var(--surface2); }
/* Dag: blokken (zoals de tijdsblokken van Atree) */
.blk { display: grid; grid-template-columns: 40px 1fr; gap: 4px 10px; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin: 10px 0; background: var(--surface); }
.blk.err { border-color: var(--c-werf); background: var(--red-soft); }
.blk-ico { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 19px; grid-row: span 2; color: #fff; }
.blk-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.blk-head b { font-family: var(--font-head); font-size: 15px; }
.blk-head .muted { font-size: 13px; }
.blk-time { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.blk-time input.t { width: 5.2em; text-align: center; font-weight: 700; font-size: 17px; padding: 6px 4px; }
.blk-time input.t.auto { color: var(--c-auto); font-style: italic; }
.blk-time input.t.bad { border-color: var(--c-werf); background: var(--red-soft); }
.dur { display: inline-block; min-width: 4.4em; text-align: center; border-radius: 8px; padding: 6px 8px; background: var(--surface2); font-weight: 700; font-family: var(--font-head); }
.dur.bad { background: var(--c-werf); color: #fff; }
.blk-more { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
.blk-more .full { grid-column: 1 / -1; }
.blk-more select, .blk-more input { width: 100%; }
.blk-more select.bad { border-color: var(--c-werf); background: var(--red-soft); }
.blk-more .km { display: flex; align-items: center; gap: 6px; } .blk-more .km input { width: 6em; }
.blk-msg { grid-column: 1 / -1; font-size: 13px; }
.quick-add { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.quick-add button { min-height: 38px; padding: 6px 12px; font-size: 14px; }
.check-list { list-style: none; padding: 0; margin: 8px 0 0; }
.check-list li { padding: 3px 0 3px 22px; position: relative; font-size: 14px; }
.check-list li::before { position: absolute; left: 0; }
.check-list li.fout { color: var(--red-text); } .check-list li.fout::before { content: '✖'; }
.check-list li.let { color: var(--warn); } .check-list li.let::before { content: '⚠'; }
.check-list li.ok { color: var(--ok); } .check-list li.ok::before { content: '✓'; }
.goal-line { font-size: 14px; margin: 4px 0; }

/* Materiaal */
.mat, .mat-head { display: grid; grid-template-columns: 1fr 5em 4.5em 1fr 36px; gap: 6px; align-items: center; margin: 6px 0; }
.mat-head { font-size: 13px; margin-bottom: 0; }
.mat input, .mat select { width: 100%; }
@media (max-width: 640px) {
  .mat-head { display: none; }
  .mat { grid-template-columns: 1fr 1fr 40px; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
  .mat-desc { grid-column: 1 / -1; } .mat-proj { grid-column: 1 / -1; grid-row: 3; }
}

/* Tabellen en formulieren */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 15px; }
th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 13px; color: var(--muted); font-weight: 700; white-space: nowrap; }
tr.click { cursor: pointer; } tr.click:hover { background: var(--surface2); }
td.actions { white-space: nowrap; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; align-items: end; margin-top: 8px; }
.form-grid label { display: flex; flex-direction: column; gap: 4px; }
.form-grid label > span { font-size: 13px; color: var(--muted); font-weight: 700; }
.form-grid input, .form-grid select { width: 100%; }
label.check { flex-direction: row !important; align-items: center; gap: 8px; min-height: 42px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.tabs a { padding: 7px 13px; border-radius: 99px; border: 1.5px solid var(--line); text-decoration: none; color: var(--fg); font-weight: 700; font-size: 14px; background: var(--surface); }
.tabs a.active { background: var(--ink); color: var(--ink-on); border-color: var(--ink); }

.who { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin-top: 12px; }
.plan-item { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.plan-item:first-of-type { border-top: none; }
.welcome { text-align: center; max-width: 480px; margin: 30px auto; padding: 28px 22px; }
.welcome-logo { width: min(320px, 90%); margin: 0 auto 10px; display: block; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .welcome-logo { background: #fff; border-radius: 12px; padding: 10px; } }
details summary { cursor: pointer; font-weight: 700; margin-top: 8px; }
.copy-list { display: grid; gap: 8px; margin-top: 8px; }
.copy-row { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.copy-row > span { grid-column: 1 / -1; }
.copy-row code { word-break: break-all; }
.copy-row button { min-height: 36px; padding: 6px 12px; }

/* Navigatie onderaan */
#nav[hidden] { display: none; }
#nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 10; display: flex; justify-content: center; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
#nav a { flex: 1; max-width: 140px; display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 8px 4px 9px; text-decoration: none; color: var(--muted); font-size: 12px; font-weight: 700; border-top: 3px solid transparent; }
#nav a span { font-size: 19px; line-height: 1.1; filter: grayscale(1); }
#nav a.active { color: var(--fg); border-top-color: var(--red); }
#nav a.active span { filter: none; }

#toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px); opacity: 0; pointer-events: none;
  background: var(--ink); color: var(--ink-on); padding: 10px 16px; border-radius: 10px; font-weight: 700; transition: .2s; max-width: calc(100% - 32px); z-index: 20; }
#toast.show { opacity: 1; transform: translateX(-50%); }
#toast.err { background: var(--red); color: #fff; }
html.test .topbar { border-bottom-style: dashed; }
html.test .topbar::after { content: 'TEST'; position: absolute; right: 50%; bottom: -12px; transform: translateX(50%); background: var(--red); color: #fff; font-size: 10px; font-weight: 700; padding: 1px 8px; border-radius: 99px; letter-spacing: .1em; }
</style>
</head>

  <a class="brand" href="#dag" aria-label="Enautec Uren, naar vandaag">
    <img src="logo-mark.svg" alt="">
    <span><b>ENAUTEC</b><small>Urenregistratie</small></span>
  </a>
  <div class="top-actions">
    <button id="updateBtn" class="update-btn" type="button" hidden aria-label="Update beschikbaar: app bijwerken">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 4V1L8 5l4 4V6a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg>
      <span>Update</span>
    </button>
    <a id="modeSwitch" class="mode-switch" href="#beheer" hidden></a>
    <button id="syncStatus" class="sync" type="button" title=""><span>Laden…</span></button>
  </div>
