<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024" role="img" aria-label="Enautec Uren (kerst)">
  <!-- Kersticoon: Enautec-driehoek met kerstmuts, sneeuw en hulst. Logo-paden uit logo-mark.svg. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7f1fb"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5a5f"/>
      <stop offset="1" stop-color="#c41f26"/>
    </linearGradient>
    <radialGradient id="fur" cx="0.5" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3e8ee"/>
    </radialGradient>
    <symbol id="flake" viewBox="-10 -10 20 20">
      <g stroke="#b9d3ea" stroke-width="1.6" stroke-linecap="round" fill="none">
        <path d="M0-9V9M-7.8-4.5 7.8 4.5M-7.8 4.5 7.8-4.5"/>
        <path d="M-2.5-6.5 0-4 2.5-6.5M-2.5 6.5 0 4 2.5 6.5"/>
      </g>
    </symbol>
  </defs>

  <rect width="1024" height="1024" fill="url(#sky)"/>

  <!-- sneeuwvlokken en sneeuwbolletjes -->
  <g>
    <use xlink:href="#flake" x="96" y="120" width="70" height="70"/>
    <use xlink:href="#flake" x="840" y="96" width="86" height="86"/>
    <use xlink:href="#flake" x="880" y="430" width="56" height="56"/>
    <use xlink:href="#flake" x="70" y="520" width="60" height="60"/>
    <use xlink:href="#flake" x="250" y="60" width="44" height="44"/>
    <use xlink:href="#flake" x="760" y="300" width="40" height="40"/>
  </g>
  <g fill="#cfe1f2">
    <circle cx="190" cy="300" r="9"/><circle cx="700" cy="170" r="11"/><circle cx="930" cy="300" r="8"/>
    <circle cx="140" cy="420" r="7"/><circle cx="600" cy="80" r="7"/><circle cx="380" cy="140" r="6"/>
    <circle cx="960" cy="620" r="9"/><circle cx="60" cy="700" r="8"/><circle cx="860" cy="220" r="6"/>
  </g>

  <!-- Enautec-driehoek (zelfde paden als het logo), iets naar beneden voor de muts -->
  <g transform="translate(224 240) scale(1.4) translate(-138 -50)">
    <g transform="translate(0,675) scale(0.1,-0.1)">
      <path fill="#111111" d="M3441 5878 c-274 -544 -1971 -3938 -1971 -3943 0 -3 691 -5 1535 -5 844 0 1535 2 1535 5 0 3 -82 169 -182 370 -135 269 -187 365 -203 369 -11 3 -343 6 -737 6 -395 0 -718 3 -718 8 1 4 50 104 109 222 l109 215 508 5 c421 4 509 7 506 19 -1 7 -75 159 -164 337 l-162 324 -162 0 c-93 0 -165 4 -169 10 -7 12 306 641 318 637 5 -1 30 -43 55 -92 l47 -90 409 -3 c227 -1 414 2 419 7 7 7 -909 1849 -932 1874 -4 4 -72 -120 -150 -275z"/>
      <path fill="#E23B3B" d="M4052 3802 l-113 -3 60 -117 c33 -64 144 -286 247 -492 103 -206 286 -574 408 -817 l221 -443 407 0 c247 0 408 4 408 9 0 9 -94 206 -118 246 -10 17 -242 482 -619 1240 -58 116 -123 247 -146 292 l-42 83 -255 1 c-140 1 -275 2 -300 3 -25 0 -96 0 -158 -2z"/>
    </g>
  </g>

  <!-- kerstmuts op de top van de driehoek (top ligt rond x=512, y=292) -->
  <g transform="translate(28 -6)">
    <path d="M392 318 C410 230 470 150 560 128 C620 114 676 150 700 214 C664 186 624 178 600 196 C572 218 584 270 590 318 Z" fill="url(#hat)"/>
    <path d="M560 128 C620 114 676 150 700 214 C690 205 676 198 662 194 C640 160 604 140 560 128 Z" fill="#a3151c" opacity=".35"/>
    <rect x="370" y="300" width="244" height="58" rx="29" fill="url(#fur)" stroke="#d5dce4" stroke-width="3"/>
    <circle cx="704" cy="222" r="38" fill="url(#fur)" stroke="#d5dce4" stroke-width="3"/>
  </g>

  <!-- sneeuwlaag onderaan -->
  <path d="M0 862 C120 820 230 850 330 836 C450 818 560 860 690 842 C820 824 920 850 1024 830 V1024 H0 Z" fill="#ffffff"/>
  <path d="M0 862 C120 820 230 850 330 836 C450 818 560 860 690 842 C820 824 920 850 1024 830" fill="none" stroke="#d3e3f2" stroke-width="6"/>

  <!-- hulst -->
  <g transform="translate(842 872)">
    <path d="M0 0 C-40 -20 -70 -10 -100 -40 C-88 -44 -80 -56 -84 -70 C-62 -58 -50 -66 -40 -80 C-34 -60 -20 -54 0 -56 C-8 -40 -6 -18 0 0 Z" fill="#1f7a45"/>
    <path d="M0 0 C40 -20 70 -10 100 -40 C88 -44 80 -56 84 -70 C62 -58 50 -66 40 -80 C34 -60 20 -54 0 -56 C8 -40 6 -18 0 0 Z" fill="#2a9a58"/>
    <circle cx="-12" cy="-12" r="17" fill="#d7262e"/><circle cx="16" cy="-16" r="17" fill="#e23b3b"/><circle cx="2" cy="10" r="17" fill="#c41f26"/>
    <circle cx="-17" cy="-17" r="5" fill="#fff" opacity=".6"/><circle cx="11" cy="-21" r="5" fill="#fff" opacity=".6"/>
  </g>
  <g transform="translate(168 900) scale(.8)">
    <path d="M0 0 C-40 -20 -70 -10 -100 -40 C-88 -44 -80 -56 -84 -70 C-62 -58 -50 -66 -40 -80 C-34 -60 -20 -54 0 -56 C-8 -40 -6 -18 0 0 Z" fill="#1f7a45"/>
    <path d="M0 0 C40 -20 70 -10 100 -40 C88 -44 80 -56 84 -70 C62 -58 50 -66 40 -80 C34 -60 20 -54 0 -56 C8 -40 6 -18 0 0 Z" fill="#2a9a58"/>
    <circle cx="-12" cy="-12" r="17" fill="#d7262e"/><circle cx="16" cy="-16" r="17" fill="#e23b3b"/><circle cx="2" cy="10" r="17" fill="#c41f26"/>
  </g>
</svg>
